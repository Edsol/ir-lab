# Copia questo file in config.yaml e modifica host MQTT.
# Pensato per Zigbee2MQTT + Tuya iH-F8260, ma i topic possono essere adattati.

mqtt:
  host: 192.168.1.10
  port: 1883
  username: ""
  password: ""
  client_id: ir-lab
  keepalive: 60

# La sezione emitters è opzionale.
# Se omessa o vuota, ir-lab scopre automaticamente i blaster IR
# ascoltando zigbee2mqtt/bridge/devices all'avvio.
#
# Configura emitters manualmente solo se la discovery automatica non funziona
# (es. broker non è Zigbee2MQTT, dispositivo ha model_id non riconosciuto)
# o se vuoi fissare un nome/topic personalizzato.
#
# emitters:
#   ir_blaster_battery:
#     friendly_name: "IR Blaster (Battery)"
#     topic_state: "zigbee2mqtt/IR Blaster (Battery)"
#     topic_set: "zigbee2mqtt/IR Blaster (Battery)/set"
