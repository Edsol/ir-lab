# Copy this file to config.yaml and set your MQTT host.
# Written for Zigbee2MQTT + Tuya iH-F8260, but the topics can be adapted.

mqtt:
  host: 192.168.1.10
  port: 1883
  username: ""
  password: ""
  client_id: ir-lab
  keepalive: 60

# The emitters section is optional.
# When omitted or empty, ir-lab discovers IR blasters automatically by
# listening on zigbee2mqtt/bridge/devices at startup.
#
# Configure emitters by hand only when auto-discovery does not work
# (broker is not Zigbee2MQTT, device has an unrecognised model_id)
# or when you want to pin a custom name/topic.
#
# emitters:
#   ir_blaster_battery:
#     friendly_name: "IR Blaster (Battery)"
#     topic_state: "zigbee2mqtt/IR Blaster (Battery)"
#     topic_set: "zigbee2mqtt/IR Blaster (Battery)/set"
